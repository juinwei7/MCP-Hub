{% if error %}<div class="note no">{{ error }}</div>{% endif %}
<form method="post" action="{{ action }}"><div class="formcard">
  <label>工具名稱(Claude 會看到的名字)</label>
  {% if is_edit %}<input name="name" value="{{ name }}" readonly>{% else %}<input name="name" placeholder="get_weather(英數與底線)" required>{% endif %}
  <label>分組(選填,方便整理與批次管理)</label><input name="group" value="{{ group }}" placeholder="例如 GitHub">
  <label>描述(告訴 AI 這個工具做什麼)</label><input name="description" value="{{ description }}" placeholder="查詢某城市目前天氣">
  <label>HTTP 方法</label>
  <select name="method"><option {% if method=='GET' %}selected{% endif %}>GET</option><option {% if method=='POST' %}selected{% endif %}>POST</option></select>
  <label>URL 模板(可用 {參數} 代入)</label><input name="url_template" value="{{ url_template }}" placeholder="https://api.example.com/weather?q={city}" required>
  <label>靜態 Headers(JSON,可放金鑰;沒有就留空)</label><textarea name="headers" placeholder='{"Authorization": "Bearer YOUR_KEY"}'>{{ headers_val }}</textarea>
  <label>參數清單(JSON)</label><textarea name="params" placeholder='[{"name":"city","type":"string","required":true,"description":"城市名"}]'>{{ params_val }}</textarea>
  <p class="hint">規則:URL 裡的 {參數} 會代入網址;其餘參數 GET 放 query、POST 放 JSON body。</p>
  <div class="actions">
    <button class="btn primary" type="submit">{% if is_edit %}儲存{% else %}新增{% endif %}</button>
    <a class="btn" href="/tools">取消</a>
  </div>
</div></form>
