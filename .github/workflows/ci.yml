name: CI

# 目的:讓每次 push 都在三個平台上實際執行驗證。
#
# 在此之前,所有驗證都只在一台 macOS 機器上跑過 —— 跨平台修正的三個
# Windows 缺陷,程式碼一行都沒在 Windows 上執行過,驗收紀錄只能誠實寫
# 「待 Windows 機器驗證」。這份 workflow 就是把那些項目變成自動驗證。
#
# 不需要任何 secret,fork 後可直接執行。

on:
  push:
    branches: ["**"]
  pull_request:

# 同一分支重複推送時,取消還在跑的舊 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 後端:三平台跑同一套測試 ────────────────────────────
  # 這是最重要的 job。Windows 的格子讓跨平台修正第一次真的被執行。
  backend:
    name: 後端 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 一個平台失敗不該遮住其他平台的結果
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 刻意不開快取:要驗證的就是「從 requirements.txt 從零安裝」能不能成。
          # jinja2 那個缺陷就是因為開發機剛好裝過才一直沒被發現。

      - name: 從零安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 確認所有模組可匯入
        # 比測試更早失敗、訊息更直接:缺依賴的話這一步就會擋下來
        run: python -c "import gateway.web, gateway.api, gateway.store, gateway.auth, gateway.hub, gateway.pool, gateway.crypto"

      - name: 全套測試
        run: python -m unittest discover -s tests -v

      - name: 金鑰保護實機驗證
        # 單元測試只驗證「選對分支」;這一步問作業系統實際開放給誰。
        # POSIX 檢查權限位元,Windows 解析 icacls 的輸出。
        run: python scripts/verify_key_protection.py

  # ── macOS app:Swift 測試與生命週期驗收 ────────────────
  macos-app:
    name: macOS app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 準備後端環境
        # 生命週期驗收會實際啟動 gateway.web,需要可用的 .venv
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt

      - name: Swift 版本
        run: swift --version

      - name: 建置
        working-directory: macos
        run: swift build

      - name: Swift 單元測試
        # NotificationGate 的去重規則 —— 這些是 Windows 版可以直接移植的部分
        working-directory: macos
        run: swift test

      - name: app 生命週期驗收
        # 實際起 app、殺程序、數殘留。孤兒程序是這個專案真實發生過的問題。
        working-directory: macos
        run: ./scripts/acceptance.sh

      - name: 殘留程序檢查
        # 驗收腳本自己會清,但再確認一次 —— CI 環境的程序行為可能不同
        if: always()
        run: |
          if pgrep -f "gateway.web" > /dev/null; then
            echo "::error::驗收結束後仍有 gateway.web 殘留"
            pgrep -fl "gateway.web"
            exit 1
          fi
          echo "無殘留程序"

  # ── Windows client:Core 的編譯與測試 ─────────────────
  # 開發機是 macOS,沒有 .NET 也沒有 Windows —— 這個 job 就是編譯器與測試機。
  # 介面層(WinUI、系統匣、Toast)還沒實作,那些需要實機互動才驗證得了。
  windows-client:
    name: Windows client (Core)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 建置
        working-directory: windows
        # 警告當錯誤已在 csproj 設定 —— 沒有本機編譯器,CI 是唯一的把關
        run: dotnet build MCPHub.Core/MCPHub.Core.csproj -c Release

      - name: 測試
        working-directory: windows
        # 含 Job Object 的實機驗證:起真的程序、關掉 job、確認被收掉
        run: dotnet test MCPHub.Core.Tests/MCPHub.Core.Tests.csproj -c Release --verbosity normal

      - name: 建置 app
        working-directory: windows
        run: dotnet build MCPHub.App/MCPHub.App.csproj -c Release

  # ── Windows app:實際起來截圖 ──────────────────────────
  # 開發機是 macOS,這個 app 在本機執行不了。編譯器抓得到型別錯誤,但抓不到
  # 版面跑掉、顏色在深色模式下看不見、控制項疊在一起。這個 job 是唯一能真的
  # 看到畫面的地方,所以把截圖變成建置的一部分 —— 截出來的圖存成 artifact。
  windows-app-shot:
    name: Windows app 截圖
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 準備後端環境
        # app 會用 MCPHUB_PYTHON / MCPHUB_REPO 指向的 venv 起後端。
        # 沒有它的話只截得到「後端啟動失敗」那個畫面。
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\pip.exe install -r requirements.txt

      - name: 建置
        working-directory: windows
        run: dotnet build MCPHub.App/MCPHub.App.csproj -c Release

      - name: 種示範資料
        # 空資料庫只渲染得出空狀態,而這份設計的主張全在「列」上 ——
        # 色條、等寬與系統字的切換、待確認的琥珀色,都要有資料才看得到。
        env:
          MCP_HUB_DB: ${{ runner.temp }}\mcphub\actions.db
          MCP_HUB_KEY: ${{ runner.temp }}\mcphub\.secret_key
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '${{ runner.temp }}\mcphub' | Out-Null
          .venv\Scripts\python.exe windows\scripts\seed_demo.py

      - name: 渲染畫面
        working-directory: windows
        env:
          MCPHUB_PYTHON: ${{ github.workspace }}\.venv\Scripts\python.exe
          MCPHUB_REPO: ${{ github.workspace }}
          MCPHUB_DATA_DIR: ${{ runner.temp }}\mcphub
        shell: pwsh
        run: |
          # --shot 把淺色與深色各渲染一張然後自己結束。不截螢幕 ——
          # runner 上沒有可靠的互動式 desktop,實測連一個有標題的最上層視窗
          # 都列不出來。用 WPF 自己的 Measure/Arrange + RenderTargetBitmap
          # 就不需要桌面,尺寸也由我們決定。詳見 Shot.cs。
          $exe = 'MCPHub.App\bin\Release\net8.0-windows\MCPHub.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--shot','shots' -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::渲染失敗,exit code $($p.ExitCode)"
            $log = Join-Path $env:MCPHUB_DATA_DIR 'crash.log'
            if (Test-Path $log) { Get-Content $log | Select-Object -Last 60 }
            exit 1
          }
          Get-Content shots\shot.log
          foreach ($n in 'servers-light','servers-dark','actions-light','actions-dark') {
            $f = "shots\$n.png"
            if (-not (Test-Path $f)) { Write-Host "::error::沒有產出 $f"; exit 1 }
            Write-Host "$f  $((Get-Item $f).Length) bytes"
          }

      - name: 殘留程序檢查
        if: always()
        # 孤兒程序是這個專案真實發生過的問題。--shot 走的是正常的 Shutdown,
        # 所以這裡驗的是 OnExit 有沒有真的把後端收掉。
        shell: pwsh
        run: |
          $leftover = Get-CimInstance Win32_Process |
            Where-Object { $_.CommandLine -like '*gateway.web*' }
          if ($leftover) {
            Write-Host "::error::app 結束後仍有後端殘留"
            $leftover | Select-Object ProcessId, CommandLine | Format-List
            exit 1
          }
          Write-Host "無殘留程序"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: windows/shots/*.png
          if-no-files-found: error

  # ── 自足 bundle:驗證打包路徑 ──────────────────────────
  bundle:
    name: 自足 bundle
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 建置並內附後端
        # 這一步會下載獨立 runtime、從零 pip install、驗證內附的 gateway 可匯入。
        # jinja2 那個缺陷就是在這條路徑上現形的。
        working-directory: macos
        run: make dist

      - name: 確認 bundle 自足
        working-directory: macos
        run: |
          APP="build/MCP Hub.app"
          BACKEND="$APP/Contents/Resources/backend"

          test -x "$BACKEND/bin/python3" || { echo "::error::找不到內附的 Python"; exit 1; }

          # 網頁管理台移除後,bundle 要有的是 API 模組而不是模板
          for m in web api api_tools api_import store crypto hub pool auth; do
            test -f "$BACKEND/gateway/$m.py" || { echo "::error::缺少 gateway/$m.py"; exit 1; }
          done

          # 用內附的 Python 匯入,不能靠 runner 上的任何東西
          PYTHONPATH="$BACKEND" "$BACKEND/bin/python3" -c "
          import gateway.web, gateway.api, gateway.api_tools, gateway.api_import
          routes = [r.path for r in gateway.web.app.routes if hasattr(r, 'path')]
          html = [p for p in routes if p in ('/', '/tools', '/logs', '/composites')]
          assert not html, f'HTML 路由不該還在:{html}'
          print(f'匯入成功,{len(routes)} 條路由')
          "
          echo "bundle 自足性確認"

      - name: 體積
        working-directory: macos
        run: du -sh "build/MCP Hub.app"
